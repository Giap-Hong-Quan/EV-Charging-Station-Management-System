services:
  # 🗄️ MySQL Database
  user_mysql:
    image: mysql:8.0
    container_name: user_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "user_db"
    volumes:
      - user_data:/var/lib/mysql
    networks:
      - evcs_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  user_service:
    build: ./User_Service
    container_name: user_service
    ports:
      - "8082:8082"
    env_file:
      - ./User_Service/.env
    depends_on:
      user_mysql:
        condition: service_healthy   # ← CHỜ MySQL HOÀN TOÀN SẴN SÀNG
    volumes:
      - ./User_Service:/app
    command: npm run dev
    restart: unless-stopped
    networks:
      - evcs_network

  # 📊 Analytics MongoDB
  analytics_mongo:
    image: mongo:6
    container_name: analytics_mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - analytics_data:/data/db
    networks:
      - evcs_network

  # 📊 Analytics Reporting Service
  analytics_reporting_service:
    build: ./Analytics_Reporting_Service
    container_name: analytics_reporting_service
    ports:
      - "5002:5002"
    env_file:
      - ./Analytics_Reporting_Service/.env
    depends_on:
      - analytics_mongo
    volumes:
      - ./Analytics_Reporting_Service:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    networks:
      - evcs_network

  # ⚡ Station MongoDB
  station_mongo:
    image: mongo:6
    container_name: station_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - station_data:/data/db
    networks:
      - evcs_network

  # ⚡ Station Management Service
  station_management_service:
    build: ./Station_Management_Service
    container_name: station_management_service
    ports:
      - "5001:5001"
    env_file:
      - ./Station_Management_Service/.env
    depends_on:
      - station_mongo
    volumes:
      - ./Station_Management_Service:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    networks:
      - evcs_network

  # 🚗 Booking MySQL
  booking_mysql:
    image: mysql:8.0
    container_name: booking_mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "292902"
      MYSQL_DATABASE: "booking_db"
    volumes:
      - booking_mysql_data:/var/lib/mysql
    networks:
      - evcs_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p292902"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 🚗 Booking Service
  booking_service:
    build: 
      context: ./booking_service
    container_name: booking_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./booking_service/.env
    depends_on:
      booking_mysql:
        condition: service_healthy
    volumes:
      - ./booking_service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - evcs_network
  
  charging_session_mongo:
    image: mongo:6
    container_name: charging_session_mongo
    restart: always
    ports:
      - "27019:27017"
    volumes:
      - charging_session_data:/data/db
    networks:
      - evcs_network
  charging_session_service:
    build:
      context: ./charging_session_service
    container_name: charging_session_service
    restart: unless-stopped
    ports:
      - "5003:5003"
    env_file:
      - ./charging_session_service/.env
    depends_on:
      - charging_session_mongo
      - booking_service        # vì session cần validate booking
      - gateway                # vì gọi qua gateway
    volumes:
      - ./charging_session_service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - evcs_network
    # 💳 Payment MongoDB
  payment_mongo:
    image: mongo:6
    container_name: payment_mongo
    restart: always
    ports:
      - "27020:27017"
    volumes:
      - payment_mongo_data:/data/db
    networks:
      - evcs_network

  # 💳 Payment Service
  payment_service:
    build:
      context: ./payment_service
    container_name: payment_service
    restart: unless-stopped
    ports:
      - "5004:5004"
    env_file:
      - ./payment_service/.env
    depends_on:
      - payment_mongo
    volumes:
      - ./payment_service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - evcs_network

  # 🌐 API Gateway
  gateway:
    build: ./gateway
    container_name: gateway
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - user_service
      - station_management_service
      - booking_service
      - analytics_reporting_service
      - payment_service
    volumes:
      - ./gateway:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - evcs_network

volumes:
  user_data:
  analytics_data:
  station_data:
  booking_mysql_data:
  charging_session_data:
  payment_mongo_data:


networks:
  evcs_network:
    driver: bridge